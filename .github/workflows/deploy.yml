name: Deploy

# Runs after CI succeeds on main. workflow_run uses the default-branch OIDC subject,
# which is what the deploy role trusts: repo:Wounded-Knee/GroundOps:ref:refs/heads/main.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: groundops-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: groundops-github-deploy
          role-duration-seconds: 7200

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false -no-color \
            -backend-config="bucket=groundops-tfstate-${account_id}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=groundops-terraform-locks" \
            -backend-config="encrypt=true"

      - name: Ensure the container repository exists
        working-directory: infra
        run: |
          set -euo pipefail
          terraform apply -input=false -no-color -auto-approve -lock-timeout=5m \
            -var="aws_region=${AWS_REGION}" \
            -target=aws_ecr_repository.api \
            -target=aws_ecr_lifecycle_policy.api

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the API image
        run: |
          set -euo pipefail
          image="${{ steps.ecr.outputs.registry }}/groundops-api:${IMAGE_TAG}"
          docker build -t "${image}" .
          docker push "${image}"

      - name: Terraform apply
        working-directory: infra
        run: |
          set -euo pipefail
          terraform apply -input=false -no-color -auto-approve -lock-timeout=5m \
            -var="aws_region=${AWS_REGION}" \
            -var="image_tag=${IMAGE_TAG}"

      - name: Wait for the service
        working-directory: infra
        run: |
          set -euo pipefail
          aws ecs wait services-stable \
            --cluster "$(terraform output -raw ecs_cluster_name)" \
            --services "$(terraform output -raw ecs_service_name)"
